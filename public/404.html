<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Página não encontrada | AMA da Favela</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #09090b;
        color: #f4f4f5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1rem;
        background:
          radial-gradient(circle at top, rgb(16 185 129 / 0.14), transparent 34rem),
          #09090b;
      }

      main {
        width: min(100%, 32rem);
        padding: 2rem;
        border: 1px solid #27272a;
        border-radius: 1.5rem;
        background: rgb(24 24 27 / 0.92);
        text-align: center;
        box-shadow: 0 24px 80px rgb(0 0 0 / 0.35);
      }

      .code {
        color: #34d399;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.18em;
      }

      h1 {
        margin: 0.75rem 0 0;
        font-size: clamp(1.75rem, 5vw, 2.5rem);
      }

      p {
        margin: 1rem auto 0;
        color: #a1a1aa;
        line-height: 1.65;
      }

      a {
        display: inline-flex;
        margin-top: 1.5rem;
        padding: 0.8rem 1.15rem;
        border-radius: 0.9rem;
        background: #10b981;
        color: #052e24;
        font-weight: 700;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid #6ee7b7;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="code">ERRO 404</div>
      <h1>Página não encontrada</h1>
      <p>
        O endereço acessado não existe, foi alterado ou não está disponível no
        momento.
      </p>
      <a href="/dashboard">Ir para o início</a>
    </main>
  </body>
</html>
